[project]
name = "hakka-tones"
version = "0.1.0"
description = "Restoring Pha̍k-fa-sṳ tone marks in Hakka text with a from-scratch BiLSTM-CRF"
readme = "README.md"
authors = [
    { name = "Sunny Cheung", email = "166468460+DuckTheDuke@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.2.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pytorch-crf>=0.7.2",
    "scikit-learn>=1.9.1",
    "sklearn-crfsuite>=0.5.0",
    "torch>=2.11.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

# macOS (M3 Pro) gets the default PyPI wheel with MPS support;
# Linux/Windows (RTX 4070) gets the CUDA 12.8 wheel.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
